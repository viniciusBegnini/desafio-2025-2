<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Exemplares Cadastrados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4 text-center">Exemplares Cadastrados</h2>

        <div class="row">
            <div class="col-12">
                <table class="table table-striped table-hover shadow">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Filme</th>
                            <th>Data de Cadastro</th>
                            <th>Ativo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="exemplar : ${exemplares}">
                            <td th:text="${exemplar.id}">1</td>
                            <td th:text="${exemplar.filme.titulo}">Título do Filme</td>
                            <td th:text="${#temporals.format(exemplar.dataCadastro, 'dd/MM/yyyy')}">01/01/2025</td>
                            <td>
                                <span th:text="${exemplar.ativo ? 'Sim' : 'Não'}"
                                    th:classappend="${exemplar.ativo ? 'text-success' : 'text-danger'}">
                                </span>
                            </td>
                            <td>
                                <a th:href="@{'/exemplares/editar/' + ${exemplar.id}}" class="btn btn-sm btn-primary">
                                    Editar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/exemplares/cadastrar" class="btn btn-success me-2">Cadastrar Novo Exemplar</a>
            <a href="/home" class="btn btn-secondary">Voltar</a>
        </div>
    </div>

</body>

</html>
