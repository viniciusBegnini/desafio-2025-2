<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Filme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h3 class="mb-4 text-center">Editar Filme</h3>
        <form th:action="@{'/filmes/editar/' + ${filme.id}}" method="post">
            <div class="row mb-3">
                <div class="col-md-12">
                    <label>Título:</label>
                    <input type="text" class="form-control" th:value="${filme.titulo}" disabled>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-12">
                    <label>Resumo:</label>
                    <textarea class="form-control" rows="3" disabled th:text="${filme.resumo}"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Pontuação:</label>
                    <input type="text" class="form-control" th:value="${filme.pontuacao}" disabled>
                </div>
                <div class="col-md-6">
                    <label>Lançamento:</label>
                    <input type="text" class="form-control"
                        th:value="${#temporals.format(filme.lancamento, 'dd/MM/yyyy')}" disabled>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Ativo:</label>
                    <select class="form-control" name="ativo">
                        <option th:selected="${filme.ativo}" value="true">Sim</option>
                        <option th:selected="${!filme.ativo}" value="false">Não</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Exemplares Disponíveis:</label>
                    <input type="number" class="form-control" name="exemplaresDisponiveis"
                        th:value="${filme.exemplaresDisponiveis}">
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                <a href="/filmes/listar" class="btn btn-secondary">Cancelar</a>
            </div>
            <div th:if="${erro}" class="alert alert-danger text-center mt-3" th:text="${erro}"></div>
        </form>
    </div>
</body>

</html>
