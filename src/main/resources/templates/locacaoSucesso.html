<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Locação Concluída</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5 text-center">
        <h2 class="mb-3 text-success">Locação cadastrada com sucesso!</h2>
        <p>Abaixo está o QR Code da locação:</p>
        <img th:src="'data:image/png;base64,' + ${qrCode}" class="img-thumbnail" style="max-width: 300px;" />
        <div class="mt-4">
            <a href="/home" class="btn btn-primary">Voltar para o Início</a>
        </div>
    </div>
</body>

</html>
