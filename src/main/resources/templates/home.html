<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Locadora UNOESC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="text-center mb-4">
        <h2>Bem-vindo à Locadora UNOESC</h2>
        <p class="lead">Escolha uma das opções abaixo</p>
    </div>

    <div class="row mb-3 justify-content-center">
        <div class="col-6 col-md-3 mb-2">
            <a href="/filmes/cadastrar" class="btn btn-outline-primary btn-lg w-100">Cadastrar Filme</a>
        </div>
        <div class="col-6 col-md-3 mb-2">
            <a href="/filmes/listar" class="btn btn-outline-success btn-lg w-100">Listar Filmes</a>
        </div>
    </div>

    <div class="row mb-3 justify-content-center">
        <div class="col-6 col-md-3 mb-2">
            <a href="/exemplares/cadastrar" class="btn btn-outline-primary btn-lg w-100">Cadastrar Exemplar</a>
        </div>
        <div class="col-6 col-md-3 mb-2">
            <a href="/exemplares/listar" class="btn btn-outline-success btn-lg w-100">Listar Exemplares</a>
        </div>
    </div>

    <div class="row mb-4 justify-content-center">
        <div class="col-6 col-md-3 mb-2">
            <a href="/locacoes/cadastrar" class="btn btn-outline-primary btn-lg w-100">Cadastrar Locação</a>
        </div>
        <div class="col-6 col-md-3 mb-2">
            <a href="/locacoes" class="btn btn-outline-success btn-lg w-100">Listar Locações</a>
        </div>
    </div>

    <div class="text-center">
        <a href="/logout" class="btn btn-outline-danger btn-lg">Sair</a>
    </div>
</div>

</body>
</html>
