<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Exemplar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Cadastro de Exemplar</h2>

    <form th:action="@{/exemplares}" method="post" class="card p-4 shadow">
        <div class="mb-3">
            <label for="filme" class="form-label">Filme</label>
            <select id="filme" name="filme.id" class="form-select" required>
                <option value="" disabled selected>Selecione um filme</option>
                <option th:each="filme : ${filmes}"
                        th:value="${filme.id}"
                        th:text="${filme.titulo}"
                        th:if="${filme.ativo}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="ativo" class="form-label">Exemplar Ativo?</label>
            <select id="ativo" name="ativo" class="form-select" required>
                <option value="true">Sim</option>
                <option value="false">Não</option>
            </select>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>

        <div class="text-center mt-3">
            <a href="/home" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</div>

</body>
</html>
