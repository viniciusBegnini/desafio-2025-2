<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Locações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">
        <h2 class="text-center mb-4">Locações</h2>
        <form class="row mb-4" method="get" action="/locacoes/listar">
            <div class="col-md-11">
                <input type="text" class="form-control" name="busca"
                    placeholder="Buscar por nome, CPF, email ou título do filme">
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Filtrar</button>
            </div>
        </form>

        <div class="mt-4" th:if="${locacoes != null}">
            <div th:if="${#lists.isEmpty(locacoes)}">
                <p class="text-center text-danger fs-5">Nenhuma locação encontrada.</p>
            </div>
        </div>

        <div class="table-responsive" th:if="${not #lists.isEmpty(locacoes)}">
            <table class="table table-bordered table-hover shadow">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Filmes</th>
                        <th>Locação</th>
                        <th>Devolução Prevista</th>
                        <th>Devolvido em</th>
                        <th>QR Code</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th colspan="10" class="bg-dark text-white text-center">Pendentes</th>
                    </tr>
                    <tr th:each="locacao : ${locacoes}" th:if="${locacao.dataDevolvido == null}" class="table-warning">
                        <td th:text="${locacao.id}"></td>
                        <td th:text="${locacao.nome}"></td>
                        <td th:text="${locacao.cpf}"></td>
                        <td th:text="${locacao.email}"></td>
                        <td th:text="${locacao.telefone}"></td>
                        <td>
                            <ul>
                                <li th:each="ex : ${locacao.exemplares}" th:text="${ex.filme.titulo}"></li>
                            </ul>
                        </td>
                        <td th:text="${#temporals.format(locacao.dataLocacao, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(locacao.dataDevolucao, 'dd/MM/yyyy')}"></td>
                        <td>
                            <form th:action="@{'/locacoes/' + ${locacao.id} + '/devolver'}" method="post"
                                onsubmit="return confirm('Confirmar devolução desta locação?')">
                                <input type="hidden" name="_method" value="put" />
                                <button type="submit" class="btn btn-sm btn-success">Marcar como Devolvido</button>
                            </form>
                        </td>
                        <td><img th:src="'data:image/png;base64,' + ${locacao.qrCode}" style="height: 100px;"
                                alt="QR Code"></td>
                    </tr>
                    <tr>
                        <th colspan="10" class="bg-dark text-white text-center">Devolvidas</th>
                    </tr>
                    <tr th:each="locacao : ${locacoes}" th:if="${locacao.dataDevolvido != null}" class="table-success">
                        <td th:text="${locacao.id}"></td>
                        <td th:text="${locacao.nome}"></td>
                        <td th:text="${locacao.cpf}"></td>
                        <td th:text="${locacao.email}"></td>
                        <td th:text="${locacao.telefone}"></td>
                        <td>
                            <ul>
                                <li th:each="ex : ${locacao.exemplares}" th:text="${ex.filme.titulo}"></li>
                            </ul>
                        </td>
                        <td th:text="${#temporals.format(locacao.dataLocacao, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(locacao.dataDevolucao, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(locacao.dataDevolvido, 'dd/MM/yyyy')}"></td>
                        <td><img th:src="'data:image/png;base64,' + ${locacao.qrCode}" style="height: 100px;"
                                alt="QR Code"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a href="/home" class="btn btn-secondary">Voltar</a>
        </div>
    </div>

</body>

</html>
